<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>Product</title>

  <link
    rel="stylesheet"
    href="style.css">

</head>
<body>

  <button
    class="back-btn"
    onclick="goBackToCatalog()">
    ← Back To Catalog
  </button>

  <h1 id="productTitle">
    Loading Product...
  </h1>

  <div class="product-page">

    <div class="product-gallery">

      <div
        id="thumbnailRow"
        class="thumbnail-row top-thumbnails">
      </div>

      <img
        id="mainImage"
        class="main-product-image"
        src=""
        alt="Product Image">

    </div>

    <div class="product-info-panel">

</html>
