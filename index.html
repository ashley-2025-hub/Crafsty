<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Crochet Shop 🧶
  </title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>

<body>

  <h1>
    My Crochet Shop 🧶
  </h1>

  <!-- =====================================
       THEME PICKER
  ====================================== -->

  <div class="theme-picker">

    <p>
      Theme:
    </p>

    <!-- Soft Taupe -->

    <button
      type="button"
      class="theme-btn taupe"
      onclick="changeBackground('#B4977E','#EFE3D3')"
      aria-label="Taupe Theme"
    ></button>

    <!-- Dusty Denim -->

    <button
      type="button"
      class="theme-btn denim"
      onclick="changeBackground('#5D799B','#EBF0F6')"
      aria-label="Denim Theme"
    ></button>

    <!-- Pastel Rose -->

    <button
      type="button"
      class="theme-btn rose"
      onclick="changeBackground('#F2C4CB','#FFF9F9')"
      aria-label="Rose Theme"
    ></button>

    <!-- Soft Lilac -->

    <button
      type="button"
      class="theme-btn lilac"
      onclick="changeBackground('#E5DCED','#FAFAFC')"
      aria-label="Lilac Theme"
    ></button>

  </div>

  <!-- =====================================
       NAVIGATION
  ====================================== -->

  <div class="nav">

    <button
      type="button"
      onclick="showSection('shop')"
    >
      🧾 Order
    </button>

    <button
      type="button"
      onclick="showSection('catalog')"
    >
      🧸 Catalog
    </button>

  </div>

  <!-- =====================================
       SHOP SECTION
  ====================================== -->

  <section id="shopSection">

    <div class="container">

      <!-- =================================
           CART
      ================================== -->

      <div class="products">

        <h2>
          🛒 In Cart
        </h2>

        <ul id="cart"></ul>

        <p id="empty">
          Your cart is empty 🧺
        </p>

        <!-- SUGGESTIONS -->

        <div id="suggestions">

          <h3>
            ✨ You may also like
          </h3>

          <div id="suggestionList"></div>

        </div>

      </div>

      <!-- =================================
           BOX
      ================================== -->

      <div class="box">

        <h2>
          Your Box
        </h2>

        <div class="box-layout">

          <!-- CANVAS -->

          <div id="canvas"></div>

          <!-- COLORS -->

          <div class="color-panel">

            <h3>
              Colors
            </h3>

            <button
              type="button"
              class="color-circle pink"
              onclick="changeSelectedColor('Pink')"
              aria-label="Pink Box"
            ></button>

            <button
              type="button"
              class="color-circle blue"
              onclick="changeSelectedColor('Blue')"
              aria-label="Blue Box"
            ></button>

            <button
              type="button"
              class="color-circle white"
              onclick="changeSelectedColor('White')"
              aria-label="White Box"
            ></button>

            <button
              type="button"
              class="color-circle brown"
              onclick="changeSelectedColor('Brown')"
              aria-label="Brown Box"
            ></button>

          </div>

        </div>

        <!-- TOTAL -->

        <h2>
          Total:
          <span id="total">0</span>
          VND
        </h2>

        <!-- CLEAR -->

        <div
          id="bin"
          onclick="clearCart()"
          title="Clear Cart"
        >
          🗑️
        </div>

      </div>

      <!-- =================================
           ORDER FORM
      ================================== -->

      <div class="products">

        <form
          id="orderForm"
          action="https://formspree.io/f/xeenrvvk"
          method="POST"
        >

          <h2>
            💖 Your Info
          </h2>

          <input
            type="text"
            name="name"
            placeholder="Your name"
            required
          >

          <input
            type="text"
            name="contact"
            placeholder="Phone / Instagram"
            required
          >

          <input
            type="hidden"
            name="order"
            id="orderData"
          >

          <button type="submit">
            Place Order
          </button>

        </form>

      </div>

    </div>

  </section>

  <!-- =====================================
       CATALOG SECTION
  ====================================== -->

  <section id="catalogSection">

    <div
      id="products"
      class="catalog"
    ></div>

  </section>

  <!-- =====================================
       SCRIPT
  ====================================== -->

  <script
    type="module"
    src="./script.js"
  ></script>

</body>

</html>
