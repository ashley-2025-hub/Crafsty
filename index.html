<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>Crochet Shop 🧶</title>

  <link
    rel="stylesheet"
    href="style.css">

</head>

<body>

  <h1>
    My Crochet Shop 🧶
  </h1>

  <!-- THEME PICKER -->

  <div class="theme-picker">

    <p>🎨 Background</p>

    <div
      class="theme-btn pink"
      onclick="changeBackground('#c86d98','#8d72c9')">
    </div>

    <div
      class="theme-btn blue"
      onclick="changeBackground('#5f87b8','#7b9ec7')">
    </div>

    <div
      class="theme-btn yellow"
      onclick="changeBackground('#b79035','#d6b867')">
    </div>

    <div
      class="theme-btn purple"
      onclick="changeBackground('#7f5fc0','#ab8ce0')">
    </div>

  </div>

  <!-- NAV -->

  <div class="nav">

    <button
      type="button"
      onclick="showSection('shop')">
      🧾 Order
    </button>

    <button
      type="button"
      onclick="showSection('catalog')">
      🧸 Catalog
    </button>

  </div>

  <!-- SHOP SECTION -->

  <section id="shopSection">

    <div class="container">

      <!-- CART -->

      <div class="products">

        <h2>🛒 In Cart</h2>

        <ul id="cart"></ul>

        <p id="empty">
          Your cart is empty 🧺
        </p>

        <!-- SUGGESTIONS -->

        <div id="suggestions">

          <h3>✨ You may also like</h3>

          <div id="suggestionList"></div>

        </div>

      </div>

      <!-- BOX -->

      <div class="box">

        <h2>Your Box</h2>

        <div class="box-layout">

          <div id="canvas"></div>

          <!-- COLORS -->

          <div class="color-panel">

            <h3>Colors</h3>

            <button
              type="button"
              class="color-circle pink"
              onclick="changeSelectedColor('Pink')">
            </button>

            <button
              type="button"
              class="color-circle blue"
              onclick="changeSelectedColor('Blue')">
            </button>

            <button
              type="button"
              class="color-circle white"
              onclick="changeSelectedColor('White')">
            </button>

            <button
              type="button"
              class="color-circle brown"
              onclick="changeSelectedColor('Brown')">
            </button>

          </div>

        </div>

        <h2>
          Total:
          <span id="total">0</span>
          VND
        </h2>

        <div
          id="bin"
          onclick="clearCart()">
          🗑️
        </div>

      </div>

      <!-- ORDER FORM -->

      <div class="products">

        <form
          id="orderForm"
          action="https://formspree.io/f/xeenrvvk"
          method="POST">

          <h2>💖 Your Info</h2>

          <input
            type="text"
            name="name"
            placeholder="Your name"
            required>

          <input
            type="text"
            name="contact"
            placeholder="Phone / Instagram"
            required>

          <input
            type="hidden"
            name="order"
            id="orderData">

          <button type="submit">
            Place Order
          </button>

        </form>

      </div>

    </div>

  </section>

  <!-- CATALOG -->

  <section
    id="catalogSection"
    style="display:none;">

    <div
      id="products"
      class="catalog">
    </div>

  </section>

  <script
    type="module"
    src="script.js">
  </script>

</body>
</html>
