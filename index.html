<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crafsty</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="main-header">
    <h1>My Crochet Shop 🧶</h1>
    
    <div class="search-container">
      <input type="text" id="searchInput" placeholder="Search products...">
    </div>

    <div class="nav-buttons">
      <button class="nav-btn">🧾 Order</button>
      <button class="nav-btn">🧸 Catalog</button>
    </div>

    <div class="theme-selector">
      <span>Theme:</span>
      <div class="theme-circle" data-theme="default"></div>
      <div class="theme-circle" data-theme="blue"></div>
      <div class="theme-circle" data-theme="pink"></div>
      <div class="theme-circle" data-theme="purple"></div>
    </div>
  </header>

  <div id="catalog">
    </div>

  <div class="checkout-box">
    <h2>🛒 In Cart</h2>
    <p class="empty-msg">Your cart is empty 🧺</p>
    
    <h3>✨ You may also like</h3>
    <div id="suggestions"></div>

    <h3>Your Box</h3>
    <div id="box-container"></div>

    <h2>Total: <span id="total-price">0</span> VND</h2>
    <button class="clear-btn">🗑️</button>
  </div>

  <div class="info-box">
    <h2>💖 Your Info</h2>
    <form id="orderForm">
      <input type="text" placeholder="Your name *" required>
      <input type="text" placeholder="Phone / Instagram *" required>
      <textarea placeholder="Notes..." rows="4"></textarea>
      <button type="submit" class="order-btn">Place Order</button>
    </form>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
