<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>My Crochet Shop</title>

  <link
    rel="stylesheet"
    href="style.css">

</head>
<body>

  <h1>
    My Crochet Shop 🧶
  </h1>

  <!-- NAV -->

  <div class="nav">

    <button>
      📋 Order
    </button>

    <button onclick="window.location.href='catalog.html'">
      🧸 Catalog
    </button>

  </div>

  <!-- MAIN -->

  <div class="container">

    <!-- CART -->

    <div class="products">

      <h2>
        🛒 In Cart
      </h2>

      <ul id="cart"></ul>

      <h3>
        ✨ You may also like
      </h3>

      <div id="suggestionList"></div>

    </div>

    <!-- BOX -->

    <div class="box">

      <h2>
        Your Box
      </h2>

      <div class="box-layout">

        <div id="canvas"></div>

        <div class="color-panel">

          <h3>Colors</h3>

          <div
            class="color-circle pink"
            onclick="changeBoxColor('#f0bfd0')">
          </div>

          <div
            class="color-circle blue"
            onclick="changeBoxColor('#8ec5ff')">
          </div>

          <div
            class="color-circle white"
            onclick="changeBoxColor('#ffffff')">
          </div>

          <div
            class="color-circle brown"
            onclick="changeBoxColor('#b57b42')">
          </div>

        </div>

      </div>

      <h2>
        Total:
        <span id="totalPrice">
          0
        </span>
        VND
      </h2>

      <button onclick="clearCart()">
        🗑️
      </button>

    </div>

    <!-- INFO -->

    <div class="products">

      <h2>
        💖 Your Info
      </h2>

      <input
        type="text"
        id="customerName"
        placeholder="Your name">

      <br><br>

      <input
        type="text"
        id="customerContact"
        placeholder="Phone / Instagram">

      <br><br>

      <button onclick="placeOrder()">
        Place Order
      </button>

    </div>

  </div>

  <script
    type="module"
    src="script.js">
  </script>

</body>
</html>
