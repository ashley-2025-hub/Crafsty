<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crochet Shop 🧶</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>My Crochet Shop 🧶</h1>

  <div class="nav">
    <button type="button" onclick="showSection('shop')">🧾 Order</button>
    <button type="button" onclick="showSection('catalog')">🧸 Catalog</button>
  </div>

  <div class="theme-picker">
    <p>Theme:</p>
    <div class="theme-btn brown" onclick="changeTheme('#9e7e67', '#efe3d3')"></div>
    <div class="theme-btn blue" onclick="changeTheme('#bbc8d8', '#ebf0f6')"></div>
    <div class="theme-btn pink" onclick="changeTheme('#d4acb4', '#fff9f9')"></div>
    <div class="theme-btn purple" onclick="changeTheme('#c091f3', '#f6effd')"></div>
  </div>

  <section id="shopSection">
    <div class="container">

      <!-- CART BOX -->
      <div class="products">
        <h2>🛒 In Cart</h2>
        <ul id="cart"></ul>
        <p id="empty">Your cart is empty 🧺</p>

        <div id="suggestions">
          <h3>✨ You may also like</h3>
          <div id="suggestionList"></div>
        </div>
      </div>

      <!-- CUSTOMIZATION BOX -->
      <div class="box">
        <h2>Your Box</h2>
        <div class="box-layout">
          <div id="canvas"></div>

          <div class="color-panel">
            <h3>Colors</h3>
            <button type="button" class="color-circle pink" onclick="changeSelectedColor('Pink')"></button>
            <button type="button" class="color-circle blue" onclick="changeSelectedColor('Blue')"></button>
            <button type="button" class="color-circle white" onclick="changeSelectedColor('White')"></button>
            <button type="button" class="color-circle brown" onclick="changeSelectedColor('Brown')"></button>
          </div>
        </div>

        <h2>Total: <span id="total">0</span> VND</h2>
        <div id="bin" onclick="clearCart()" title="Clear Cart">🗑️</div>
      </div>

      <!-- INFO/ORDER FORM -->
      <div class="products">
        <form id="orderForm" action="https://formspree.io/f/xeenrvvk" method="POST">
          <h2>💖 Your Info</h2>
          <input type="text" name="name" placeholder="Your name" required>
          <input type="text" name="contact" placeholder="Phone / Instagram" required>
          <input type="hidden" name="order" id="orderData">
          <button type="submit">Place Order</button>
        </form>
      </div>

    </div>
  </section>

  <section id="catalogSection" style="display: none;">
    <div id="products" class="catalog"></div>
  </section>

  <script type="module" src="./script.js"></script>
</body>
</html>
