<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crafsty - Admin Panel</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>

  <div class="admin-container">
    <header class="admin-header">
      <h1>Crafsty Admin Panel 🧶</h1>
      <a href="index.html" class="back-btn">← Back to Shop</a>
    </header>

    <main class="admin-content">
      <!-- PRODUCT UPLOAD FORM -->
      <section class="form-section">
        <h2>Add New Product</h2>
        <form id="productForm">
          
          <div class="form-group">
            <label for="productName">Product Name *</label>
            <input type="text" id="productName" placeholder="e.g., Cute Cozy Bear" required />
          </div>

          <div class="form-group">
            <label for="productFolder">Product Folder Name *</label>
            <input type="text" id="productFolder" placeholder="e.g., bear (matches assets folder)" required />
          </div>

          <div class="form-group">
            <label for="productPrice">Price (VND) *</label>
            <input type="number" id="productPrice" placeholder="e.g., 25000" required />
          </div>

          <div class="form-group">
            <label for="productDescription">Description</label>
            <textarea id="productDescription" placeholder="Describe the item (e.g., soft plush bear, handmade)..." rows="4"></textarea>
          </div>

          <div class="form-group">
            <label for="productTags">Product Tags (comma-separated)</label>
            <input type="text" id="productTags" placeholder="e.g., bear, cute, brown, soft, sticker" />
            <small class="help-text">Separate tags with commas. These help your search engine find items easily!</small>
          </div>

          <button type="submit" class="submit-btn">Add Product to Catalog</button>
        </form>
      </section>

      <!-- LIVE PRODUCT MONITOR LIST -->
      <section class="list-section">
        <h2>Live Catalog Monitor</h2>
        <div id="productList" class="product-grid">
          <!-- Live Firebase products inject here automatically -->
        </div>
      </section>
    </main>
  </div>

  <!-- FIREBASE & CORE LOGIC INTERACTION -->
  <script type="module" src="admin.js"></script>
</body>
</html>
