<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Admin Panel
  </title>

  <link
    rel="stylesheet"
    href="style.css"
  >

  <link
    rel="stylesheet"
    href="admin.css"
  >

</head>

<body>

  <h1>
    Admin Panel 🧶
  </h1>

  <div class="admin-wrapper">

    <!-- LEFT -->

    <div class="admin-box">

      <h2>
        Add Product
      </h2>

      <form id="productForm">

        <input
          id="name"
          type="text"
          placeholder="Product Name"
        >

        <input
          id="folder"
          type="text"
          placeholder="Folder Name (example: bear)"
        >

        <!-- Add this inside your form, right under the Product Folder input -->
<div class="form-group">
  <label for="productTags">Product Tags (comma-separated):</label>
  <input type="text" id="productTags" placeholder="e.g. bear, cute, brown, sticker" />
</div>

        <input
          id="price"
          type="number"
          placeholder="Price"
        >

        <textarea
          id="description"
          placeholder="Description"
        ></textarea>

<button type="submit">
  Add Product
</button>
        
      </form>

    </div>

    <!-- RIGHT -->

    <div id="productList"></div>

  </div>

  <script
    type="module"
    src="./admin.js"
  ></script>

</body>

</html>
